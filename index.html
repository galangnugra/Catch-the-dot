<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game 2D Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="start-menu" class="card">
    <h2>Daftar Pemain</h2>
    <input type="text" id="username" placeholder="Username" required>
    <input type="tel" id="wa" placeholder="Nomor WA" required>
    <button onclick="startGame()">Mulai Bermain</button>
  </div>

  <div id="game-container" style="display: none;">
    <div id="ui">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
  </div>

  <div id="game-over-menu" class="card" style="display: none;">
    <h2>Game Over!</h2>
    <p>Skor Akhir: <span id="final-score">0</span></p>
    
    <h3>10 Leaderboard Teratas</h3>
    <ol id="leaderboard-list"></ol>
    
    <button onclick="restartGame()">Main Lagi</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
